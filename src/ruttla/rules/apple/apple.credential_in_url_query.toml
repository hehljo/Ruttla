format = "ruttla-rule/0"
id = "apple.credential_in_url_query"
title = "Passwort oder OTP als URL-Query-Parameter"
platform = "apple"
severity = "error"
guideline = "CLAUDE.md § Zugangsdaten gehören nie in eine URL"
tags = ["security", "network", "logging"]
references = ["https://developer.apple.com/documentation/foundation/urlrequest/httpbody"]
rationale = """
Ein Passwort in `URLComponents.queryItems` landet in der Request-URL — und
die schreibt CFNetwork bei jedem Verbindungsfehler im Klartext ins Systemlog
(`NSErrorFailingURLStringKey`), dazu in Proxy- und Server-Zugriffslogs.

Belegt am 06.10.2026 (SynologyPhotos/Lugga): der Login schickte `passwd=` per
GET; ein Nutzer kopierte das Xcode-Log in einen Chat, beide Passwörter standen
darin, je Fehlversuch mehrfach. Der Fix ist ein POST mit form-urlencoded Body.

Geprüft wird die Zuweisung an `queryItems` (direkt, per `append` oder als
gleichnamige Sammelvariable). Ein Array, das in einen Body kodiert wird,
heißt anders und ist kein Befund."""

[scope]
extensions = [".swift"]
unit_label = "Swift-Dateien"
no_files_reason = "Keine Swift-Dateien gefunden."

[match]
# Ganze Datei: das Array-Literal spannt Zeilen. `[^\]]*?` endet am ersten `]`,
# bleibt also im Literal bzw. im append-Aufruf.
pattern = '''queryItems\s*(?:\??\.append\(\s*(?:contentsOf:\s*)?|=\s*)\[?[^\]]*?URLQueryItem\(\s*name:\s*"(passwd|password|pwd|passcode|passwort|otp_code|otp)"'''
message = "Zugangsdaten '{1}' gehen als URL-Query-Parameter raus und landen im Klartext im Systemlog."
fix = "Per POST senden: `request.httpMethod = \"POST\"`, Parameter form-urlencoded in `httpBody`, Content-Type `application/x-www-form-urlencoded`."

[[fixtures]]
name = "Sammelvariable queryItems mit passwd (Original-Fehler)"
expect = "fail"
expect_finding_contains = "passwd"
[fixtures.files]
"Sources/Client.swift" = """
func login() async throws {
    var components = URLComponents(url: base, resolvingAgainstBaseURL: false)
    var queryItems = [
        URLQueryItem(name: "api", value: "SYNO.API.Auth"),
        URLQueryItem(name: "account", value: config.account),
        URLQueryItem(name: "passwd", value: config.password),
    ]
    components?.queryItems = queryItems
}
"""

[[fixtures]]
name = "direkt zugewiesenes Literal"
expect = "fail"
[fixtures.files]
"Sources/Client.swift" = """
components.queryItems = [URLQueryItem(name: "user", value: u), URLQueryItem(name: "password", value: p)]
"""

[[fixtures]]
name = "per append nachgereicht"
expect = "fail"
expect_finding_contains = "otp_code"
[fixtures.files]
"Sources/Client.swift" = """
components?.queryItems?.append(URLQueryItem(name: "otp_code", value: otp))
"""

[[fixtures]]
name = "Body-Array unter anderem Namen (der Fix)"
expect = "pass"
[fixtures.files]
"Sources/Client.swift" = """
var params = [
    URLQueryItem(name: "account", value: config.account),
    URLQueryItem(name: "passwd", value: config.password),
]
var request = URLRequest(url: base)
request.httpMethod = "POST"
request.httpBody = formEncoded(params)
"""

[[fixtures]]
name = "Query ohne Zugangsdaten"
expect = "pass"
[fixtures.files]
"Sources/Client.swift" = """
components?.queryItems = [
    URLQueryItem(name: "api", value: "SYNO.API.Auth"),
    URLQueryItem(name: "method", value: "logout"),
    URLQueryItem(name: "_sid", value: sid),
]
"""

[[fixtures]]
name = "anderes Literal endet vor dem Passwort"
expect = "pass"
[fixtures.files]
"Sources/Client.swift" = """
components?.queryItems = [URLQueryItem(name: "api", value: "x")]
let body = [URLQueryItem(name: "passwd", value: pw)]
"""
