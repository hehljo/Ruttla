format = "ruttla-rule/0"
id = "docs.trailing_whitespace"
title = "Trailing Whitespace in Markdown-Dateien"
platform = "universal"
severity = "warning"
guideline = "GUIDELINES.md § Documentation — git diff --check clean"
rationale = """
Findet Zeilen mit überflüssigem Whitespace am Zeilenende in Markdown-Dateien,
die `git diff --check` fehlschlagen lassen."""

[scope]
extensions = [".md"]
unit_label = "Markdown-Dateien"
# Zeilenweise wie git diff --check: Kommentare gibt es in Markdown nicht.
skip_comments = false

[match]
# Je Zeile wie im Python-Original (`trailing_re.search(zeile)` über `sf.lines`).
per_line = true
pattern = '[ \t]+$'
message = "Trailing Whitespace am Zeilenende (bricht git diff --check)."
fix = "Leerzeichen am Zeilenende entfernen."

[[fixtures]]
name = "Trailing Whitespace in Liste"
expect = "fail"
expect_finding_contains = "Trailing Whitespace"
[fixtures.files]
"docs/test.md" = """
- [ ] Punkt
-\u0020\u0020
- [ ] Weiterer Punkt
"""

[[fixtures]]
name = "Saubere Markdown-Datei"
expect = "pass"
[fixtures.files]
"docs/test.md" = """
- [ ] Punkt
-
- [ ] Weiterer Punkt
"""

[[fixtures]]
name = "Leerzeichen vor einem Formfeed beendet eine Zeile"
expect = "fail"
expect_findings = 1
[fixtures.files]
"docs/test.md" = "- [ ] Punkt \f- [ ] Weiterer Punkt\n"

[[fixtures]]
name = "Geschuetztes Leerzeichen am Zeilenende"
expect = "pass"
[fixtures.files]
"docs/test.md" = "- [ ] Punkt\u00a0\n"
