format = "ruttla-rule/0"
id = "secrets.credential_in_url"
title = "Passwort wird in einen URL-String eingesetzt"
platform = "universal"
severity = "error"
guideline = "CLAUDE.md § Zugangsdaten gehören nie in eine URL"
tags = ["security", "network", "logging"]
rationale = """
Ein in die URL eingesetztes Passwort (`?password=${pw}`, `&passwd=\\(pw)`)
steht in Systemlogs, Browserverlauf, Proxy- und Server-Zugriffslogs.

Belegt am 06.10.2026 (SynologyPhotos/Lugga): CFNetwork protokollierte bei
jedem Verbindungsfehler die vollständige Login-URL samt Passwort. Gegenstück
für Swift-`URLComponents`: `apple.credential_in_url_query`."""

[scope]
extensions = [
    ".swift", ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".py", ".cs",
    ".kt", ".java", ".go", ".rs", ".gd", ".sh", ".ps1", ".vue", ".svelte",
]
unit_label = "Quelldateien"

[match]
# Je Zeile: ein URL-String endet am Zeilenende.
per_line = true
pattern = '''(?i)[?&](passwd|password|passwort|pwd|passcode)=(?:\\\(|\$\{|\{[A-Za-z_]|["']\s*\+|%[s@]|\$[A-Za-z_])'''
message = "Passwort-Parameter '{1}' wird in eine URL eingesetzt."
fix = "Zugangsdaten in den POST-Body (form-urlencoded oder JSON) oder einen Header legen, nie in die URL."

[[fixtures]]
name = "Swift-Interpolation"
expect = "fail"
expect_finding_contains = "passwd"
[fixtures.files]
"Sources/Api.swift" = """
let url = URL(string: "\\(base)/webapi/auth.cgi?account=\\(user)&passwd=\\(password)")!
"""

[[fixtures]]
name = "JS-Template und Python-f-String"
expect = "fail"
expect_findings = 2
[fixtures.files]
"src/api.ts" = """
const r = await fetch(`${base}/login?user=${u}&password=${pw}`);
"""
"tool/login.py" = """
url = f"{base}/login?user={u}&password={pw}"
"""

[[fixtures]]
name = "zwei Treffer in einer Zeile sind ein Befund"
expect = "fail"
expect_findings = 1
[fixtures.files]
"src/a.js" = """
const u = base + '?password=' + pw + '&passwd=' + pw;
"""

[[fixtures]]
name = "Formfeed trennt Zeilen: Befund in der richtigen Zeile"
expect = "fail"
expect_findings = 1
expect_finding_contains = "&pwd="
[fixtures.files]
"src/b.js" = "const a = 1;\fconst u = base + '&pwd=' + pw;\n"

[[fixtures]]
name = "kein Treffer über den Zeilenumbruch"
expect = "pass"
[fixtures.files]
"src/c.js" = """
const u = base + '?password=';
// $user wird hier nicht eingesetzt
"""

[[fixtures]]
name = "Passwort im Body, Platzhalter in Doku-String"
expect = "pass"
[fixtures.files]
"src/api.ts" = """
const r = await fetch(`${base}/login`, { method: 'POST', body: new URLSearchParams({ user: u, password: pw }) });
const hint = 'Reset-Link: /reset?password=neu';
"""
