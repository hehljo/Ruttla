format = "ruttla-rule/0"
id = "web.secret_reaches_browser"
title = "API-Schlüssel erreicht den Browser"
platform = "web"
severity = "error"
guideline = "CODE_QUALITY_GUIDELINES_WEB.md § 5b Regel 1"
rationale = """
VITE_/NEXT_PUBLIC_/REACT_APP_-Variablen landen im ausgelieferten Bundle.

Gemessen wird der NAME der Variablen — wer einen KI-Schlüssel über ein
client-sichtbares Präfix bezieht, hat ihn veröffentlicht, ganz gleich wie
die Umgebung konfiguriert ist."""
safe_by_default = true

[scope]
extensions = [".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".vue", ".svelte"]
unit_label = "Web-Dateien"
no_files_reason = "Keine Web-Quelldateien gefunden."

[match]
pattern = '\b(?:import\.meta\.env|process\.env)\.((?:VITE_|NEXT_PUBLIC_|REACT_APP_|PUBLIC_|NUXT_PUBLIC_|EXPO_PUBLIC_)\w*(?:API_?KEY|SECRET|TOKEN|PASSWORD|SERVICE_ROLE|PRIVATE)\w*)'
message = "'{1}' ist client-sichtbar und trägt ein Geheimnis im Namen."
fix = "Den Aufruf über eine eigene Serverfunktion leiten. Der Key erreicht den Browser nie — als Header, nicht im Query-String."
guideline = "CODE_QUALITY_GUIDELINES_WEB.md § 5b"

# Der Supabase-anon-Key DARF öffentlich sein (RLS sichert ab).
[[match.exclude]]
group = 1
pattern = '(?i)anon'

[[fixtures]]
name = "Gemini-Key im Client"
expect = "fail"
[fixtures.files]
"package.json" = "{\"name\":\"app\",\"dependencies\":{\"vite\":\"^5\"}}"
"src/ai.ts" = """
const key = import.meta.env.VITE_GEMINI_API_KEY;
"""

[[fixtures]]
name = "Aufruf über die eigene Funktion"
expect = "pass"
[fixtures.files]
"package.json" = "{\"name\":\"app\",\"dependencies\":{\"vite\":\"^5\"}}"
"src/ai.ts" = """
const r = await fetch('/api/generate', { method: 'POST' });
"""

# Der Ausschluss braucht seinen eigenen grünen Fall (`ruttla rule test`).
# Der übliche Name VITE_SUPABASE_ANON_KEY trifft das Muster gar nicht
# (kein API_KEY/SECRET/TOKEN) — der Ausschluss greift nur bei Namen, die
# beides tragen.
[[fixtures]]
name = "Supabase-anon-Key mit API_KEY im Namen"
expect = "pass"
[fixtures.files]
"package.json" = "{\"name\":\"app\",\"dependencies\":{\"vite\":\"^5\"}}"
"src/db.ts" = """
const anon = import.meta.env.VITE_SUPABASE_ANON_API_KEY;
"""
