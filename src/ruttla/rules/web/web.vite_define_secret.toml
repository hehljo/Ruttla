format = "ruttla-rule/0"
id = "web.vite_define_secret"
title = "Vite ersetzt Client-Konstanten durch Servergeheimnisse"
platform = "web"
severity = "error"
guideline = "CODE_QUALITY_GUIDELINES_WEB.md § 5b Regel 1"
rationale = """
Minimal reproduziertes Fehlerbild: loadEnv mit leerem Präfix liest auch
Servervariablen. Eine explizite process.env.API_KEY-Ersetzung über
JSON.stringify(env.PROVIDER_API_KEY) kann den Wert in verwendeten
Clientausdrücken publizieren, ohne VITE_-Präfix.

Die Regel misst ausschließlich diese direkte Ersetzungsform mit zwei
eindeutig geheimnisverdächtigen Namen in einer loadEnv-Datei. Sie beweist
keinen tatsächlich vorhandenen Schlüssel und keine Bundle-Verwendung.
Aliases, berechnete Schlüssel, Destrukturierung, Wrapper und SSR-only-
Builds brauchen zusätzliche Prüfung. Kein vollständiger Datenflusscheck.
"""
references = ["https://vite.dev/config/shared-options.html#define", "https://vite.dev/guide/env-and-mode.html"]
safe_by_default = false
introduced_in = "0.1.0"

[scope]
extensions = [".ts", ".js", ".mjs", ".mts", ".cjs", ".cts"]
unit_label = "loadEnv-Konfigurationsdateien"
require_text = "loadEnv"
no_files_reason = "Keine loadEnv-Konfigurationsdatei; direkte Vite-Ersetzung nicht gemessen."

[match]
pattern = '''['"]process\.env\.([A-Z0-9_]*(?:API_?KEY|SECRET|PASSWORD|PRIVATE_KEY|SERVICE_ROLE_KEY)[A-Z0-9_]*)['"]\s*:\s*JSON\.stringify\s*\(\s*(?:env|process\.env)\.([A-Z0-9_]*(?:API_?KEY|SECRET|PASSWORD|PRIVATE_KEY|SERVICE_ROLE_KEY)[A-Z0-9_]*)\s*\)'''
message = "Vite-Ersetzung '{1}' bezieht das mögliche Servergeheimnis '{2}' direkt."
fix = "Ersetzung entfernen; benötigte Provideraufrufe über einen eigenen Server ausführen. Danach die konkrete Bundle-Verwendung prüfen."

[[fixtures]]
name = "Gesund zuerst: nur öffentliche Versionskonstante"
expect = "pass"
[fixtures.files]
"vite.config.ts" = '''import { loadEnv } from 'vite';
const env = loadEnv(mode, '.', '');
export default { define: { 'process.env.VERSION': JSON.stringify(env.VERSION) } };
'''

[[fixtures]]
name = "Einzeldefekt: Providergeheimnis unter generischem Alias"
expect = "fail"
expect_findings = 1
expect_finding_contains = "PROVIDER_API_KEY"
[fixtures.files]
"vite.config.ts" = '''import { loadEnv } from 'vite';
const env = loadEnv(mode, '.', '');
export default { define: { 'process.env.API_KEY': JSON.stringify(env.PROVIDER_API_KEY) } };
'''

[[fixtures]]
name = "Einzeldefekt: mehrzeilige direkte Passwort-Ersetzung"
expect = "fail"
expect_findings = 1
[fixtures.files]
"vite.config.mjs" = '''import { loadEnv } from 'vite';
export default { define: {
  "process.env.PASSWORD": JSON.stringify(
    process.env.DATABASE_PASSWORD
  )
} };
'''

[[fixtures]]
name = "Gesund: dokumentierter auskommentierter Defekt"
expect = "pass"
[fixtures.files]
"vite.config.ts" = '''import { loadEnv } from 'vite';
// 'process.env.API_KEY': JSON.stringify(env.PROVIDER_API_KEY)
export default { define: {} };
'''

[[fixtures]]
name = "Gesund: Entfernung der direkten Ersetzung"
expect = "pass"
[fixtures.files]
"vite.config.ts" = '''import { loadEnv } from 'vite';
const env = loadEnv(mode, '.', '');
export default { plugins: [], define: {} };
'''

[[fixtures]]
name = "Ungemessen: nur Backend ohne loadEnv"
expect = "unmeasured"
[fixtures.files]
"server.ts" = '''const key = process.env.PROVIDER_API_KEY;'''
