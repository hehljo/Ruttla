[package]
name = "ruttla-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Linear-time, parallel rule engine for Ruttla (ADR-0011)."
publish = false
# Gemessen am 2026-10-05 mit dem eingecheckten Cargo.lock: 1.85 baut, 1.84
# scheitert (indexmap 2.14 nutzt Edition 2024). scripts/engine_gate.py liest
# den Wert und meldet jede ältere Toolchain als "nicht gemessen".
rust-version = "1.85"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
