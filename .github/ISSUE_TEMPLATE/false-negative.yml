name: False negative
description: A rule stayed green on broken code
labels: [false-negative]
body:
  - type: input
    id: check
    attributes: { label: Check ID you expected to fire }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: "ruttla --version" }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Minimal broken reproduction }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why the rule should have matched }
    validations: { required: true }
