# Wiederverwendbares Ruttla-Gate für alle Projekte (workflow_call).
# Aufruf aus einem Projekt: docs/integrations/templates/ruttla-caller.yml
#
# - Pull Request: Profil und Ausnahmen kommen aus dem Basis-Branch (--trusted-ref),
#   lokale Änderungen daran im PR wirken nicht.
# - Branch agent/*: zusätzlich `ruttla guard` (Policy, Unterdrückungen, entfernte Tests).
# - SARIF-Upload nur in öffentlichen Repos (Code Scanning privat braucht eine Lizenz).
# - Exit 2 (nicht gemessen) ist rot.
name: ruttla-gate

on:
  workflow_call:
    inputs:
      ruttla-ref:
        description: "Ruttla-Version (Tag oder Commit; main nur bis zum ersten Release)"
        type: string
        default: main
      agent-branch-prefix:
        description: "Branches mit diesem Präfix laufen zusätzlich durch ruttla guard"
        type: string
        default: agent/

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Ruttla
        shell: bash
        env:
          # Eingaben nie direkt in ein Skript einsetzen (Shell-Injection); geprüft als Ref.
          RUTTLA_REF: ${{ inputs.ruttla-ref }}
        run: |
          [[ "$RUTTLA_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "ungültige ruttla-ref"; exit 1; }
          python -m pip install "ruttla @ git+https://github.com/hehljo/Ruttla@${RUTTLA_REF}"
      - name: Scan
        id: scan
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          trusted=()
          if [ -n "$BASE_REF" ]; then trusted=(--trusted-ref "origin/$BASE_REF"); fi
          set +e
          ruttla . "${trusted[@]}" --format agent --sarif ruttla.sarif > ruttla.txt
          status=$?
          set -e
          cat ruttla.txt
          { echo '### Ruttla'; echo '```'; tail -n 40 ruttla.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Guard agent branch
        id: guard
        if: github.base_ref != '' && startsWith(github.head_ref, inputs.agent-branch-prefix)
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          ruttla guard . --base "origin/$BASE_REF"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      # Ein Pull Request bestimmt seinen eigenen Workflow: er kann den Aufruf dieses
      # Gates umschreiben oder entfernen. Das lässt sich ohne Organisation (Required
      # Workflows) nicht verhindern — wohl aber sichtbar machen: jede Änderung unter
      # .github/workflows/ macht diesen Lauf rot und braucht einen bewussten Merge.
      - name: Workflow changed in this pull request
        id: workflows
        if: github.base_ref != ''
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE_REF" HEAD -- .github/workflows/; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            git diff --stat "origin/$BASE_REF" HEAD -- .github/workflows/
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload findings to code scanning
        if: always() && github.event.repository.visibility == 'public' && hashFiles('ruttla.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ruttla.sarif
          category: ruttla
      - name: Enforce
        shell: bash
        run: |
          case "${{ steps.scan.outputs.status }}" in
            0) echo "gate green";;
            1) echo "blocking findings"; exit 1;;
            2) echo "NOTHING was measured — not a success"; exit 1;;
            *) echo "runner error"; exit 1;;
          esac
          if [ "${{ steps.workflows.outputs.changed }}" = "1" ]; then
            echo "workflow files changed — review by a human, then merge deliberately"; exit 1
          fi
          case "${{ steps.guard.outputs.status }}" in
            ""|0) ;;
            1) echo "agent fix bypassed the gate (policy, suppression or removed test)"; exit 1;;
            *) echo "guard error"; exit 1;;
          esac
