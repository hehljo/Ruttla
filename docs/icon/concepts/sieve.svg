<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style>
    .mark { color: #C92A2A; }
    @media (prefers-color-scheme: dark) { .mark { color: #FF6B6B; } }
  </style>
  <defs>
    <clipPath id="bowl">
      <path d="M92 212 A164 140 0 0 0 420 212 Z"/>
    </clipPath>
    <mask id="cutBug">
      <rect width="512" height="512" fill="#fff"/>
      <ellipse cx="256" cy="300" rx="44" ry="52" fill="#000"/>
    </mask>
    <mask id="bugShell">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="252" y="292" width="8" height="50" fill="#000"/>
    </mask>
  </defs>
  <g class="mark" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sieb: Rand, Schale, Griff -->
    <ellipse cx="256" cy="212" rx="164" ry="38" fill="none" stroke-width="22"/>
    <path d="M92 212 A164 140 0 0 0 420 212" fill="none" stroke-width="22"/>
    <path d="M414 198 L494 160" fill="none" stroke-width="24"/>
    <!-- Geflecht, um den gefangenen Käfer ausgespart -->
    <g clip-path="url(#bowl)" mask="url(#cutBug)" fill="none" stroke-width="7">
      <path d="M60 180 L300 420 M110 180 L350 420 M160 180 L400 420 M210 180 L450 420 M260 180 L500 420 M10 180 L250 420 M-40 180 L200 420"/>
      <path d="M460 180 L220 420 M410 180 L170 420 M360 180 L120 420 M310 180 L70 420 M260 180 L20 420 M510 180 L270 420 M560 180 L320 420"/>
    </g>
    <!-- gefangener Käfer -->
    <g fill="currentColor" stroke="none" mask="url(#bugShell)">
      <ellipse cx="256" cy="314" rx="22" ry="27"/>
      <circle cx="256" cy="281" r="11"/>
    </g>
    <g fill="none" stroke-width="7">
      <path d="M236 302 L220 292 M234 316 L216 316 M236 330 L222 342 M276 302 L292 292 M278 316 L296 316 M276 330 L290 342"/>
      <path d="M250 271 L242 260 M262 271 L270 260"/>
    </g>
    <!-- Rüttelstriche -->
    <g fill="none" stroke-width="14">
      <path d="M50 150 Q34 212 50 274"/>
      <path d="M20 170 Q8 212 20 254"/>
      <path d="M462 236 Q478 290 462 344"/>
      <path d="M492 256 Q504 290 492 324"/>
    </g>
    <!-- was durchfällt, ist sauber -->
    <g fill="currentColor" stroke="none">
      <rect x="214" y="398" width="22" height="22" rx="5"/>
      <rect x="264" y="432" width="22" height="22" rx="5"/>
      <rect x="292" y="384" width="18" height="18" rx="4"/>
      <rect x="236" y="470" width="16" height="16" rx="4"/>
    </g>
  </g>
</svg>
